<h3>Search Results</h3>

{% if users %}
<table class="table">
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
    </tr>

    {% for u in users %}
    <tr>
        <td>{{ u.id }}</td>
        <td>{{ u.username }}</td>
        <td>{{ u.email }}</td>
    </tr>
    {% endfor %}
</table>

{% else %}
<p>No users found</p>
{% endif %}
