<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login Form</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
     crossorigin="anonymous">
     <style>
        #form-body{
            height: 400px;
            margin-top: 230px;
        }
     </style>
</head>
<body>
    <div id="main">
        
        <div id="canvas">
            <div id="form-body">
                <h2>Login Form</h2>
                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Username</label>
                        <input type="text" class="form-control" id="name" name="username">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="passwd">
                    </div>
                    <div class="text-center">
                        <input type="submit" class="btn btn-outline-primary" value="Login"><br></div>
                     <div>
                        Are you a new student user ?
                        <a href="{{ url_for('student_signup') }}" class="btn btn-link">
                            Student Signup
                        </a>
                    </div>

                    <div>
                        Are you a new company user ?
                        <a href="{{ url_for('company_signup') }}" class="btn btn-link">
                            Company Signup
                        </a>
                    </div>
                                        
                </form>
            </div>
        </div>
    </div>
</body>
</html>
