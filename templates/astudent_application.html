<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student application</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
     crossorigin="anonymous">
    
</head>
<body>
    <div id="main">
        
        <div id="canvas">
        
        <div class="d-flex justify-content-between align-items-center mt-3 mx-2">
            <h2>Student Application</h2>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-primary px-4 py-2 mx-2">
                <i class="bi bi-arrow-left me-2">Back</i>
            </a>
        </div>
        <div class="mt-3 mx-2"> <strong>Student Name :</strong> {{ student_profile.user.name }}</div>
        <div class="mt-3 mx-2"><strong>Student Department :</strong> {{ student_profile.department }}</div>

        <div class="mt-3 mx-2"><strong>Drive Name :</strong> {{ application.drive.name }}</div>
        <div class="mt-3 mx-2"><strong>Job Title :</strong> {{ application.drive.job_title }}</div>

        <!-- <div class="mt-3 mx-2">
            <a href="{{ student_profile.resume }}" target="_blank">
                View Resume
            </a>
        </div> -->
        <div class="mt-3 mx-2"> <strong>Resume : </strong>{{student_profile.resume}}</div>

        <div class="mt-3 mx-2">
    <strong>Status :</strong> {{ application.status }}
    </div>

    </div>
</body>
</html>
