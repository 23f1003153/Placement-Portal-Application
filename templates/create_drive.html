<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create Drive</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
     crossorigin="anonymous">
     <style>
        #canvas{
            border: 2px solid black;
            width:60%;
            height:800px;
            margin:auto;
        }
        #form-body{
            height:730px
        }
     </style>
</head>
<body>
    <div id="main">
        
        <div id="canvas">
            <div id="form-body">
                <h2>Create Drive</h2>
               
                <form action="/create_drive" method="POST">

                    <div class="mb-3">
                        <label class="form-label">Drive Name</label>
                        <input type="text" class="form-control" name="drivename" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Job Title</label>
                        <input type="text" class="form-control" name="jobtitle" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Job Description</label>
                        <textarea class="form-control" name="description"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Salary</label>
                        <input type="number" class="form-control" name="salary">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Eligibility</label>
                        <input type="text" class="form-control" name="eligibility">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Location</label>
                        <input type="text" class="form-control" name="location">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Application Deadline</label>
                        <input type="date" class="form-control" name="deadline">
                    </div>

                    <button type="submit" class="btn btn-success">Save</button>

                </form>
            </div>
        </div>
    </div>
</body>
</html>
