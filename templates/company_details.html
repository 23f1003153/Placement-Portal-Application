<!DOCTYPE html>
<html lang="en">
<head>
    <title>Company Details</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
     crossorigin="anonymous">
</head>
<body>
    <div id="main"> 
        <div id="canvas">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                <a class="navbar-brand" href="#">{{details.company_name}}</a>
                
                <ul class="nav justify-content-end">
                <li class="nav-item">
                    <a class="btn btn-outline-primary px-4 py-2" href="{{url_for('student_dashboard')}}">Back</a>
                </li>
                </ul>    
                
                </div>
            </nav>
            <div class="overview-card">
                <h4>Overview</h4>
                <p>{{details.description}}</p>
            </div>

            <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Current Drives</h5>

            </div>

            <div class="card-body">
                <table class="table table-bordered align-middle">
                <tbody>
                    {% for drive in drives %}
                    <tr>
                        <td>{{drive.name}}</td>
                        <td class="text-end">
                            
                            <a href="{{ url_for('drive_details', drive_id=drive.id) }}"
                            class="btn btn-sm btn-outline-primary">
                            View Details
                            </a>
                        </td>
                    </tr>
                    {% else %}
                    
                    <tr>
                        <td colspan="2" class="text-center text-muted">No drives available</td>
                    </tr>
                    {% endfor %}
                </tbody>
                </table>
            </div>
            </div>

        </div>
    </div>
</body>
</html>
