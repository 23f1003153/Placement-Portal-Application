<!DOCTYPE html>
<html lang="en">
<head>
    <title>Update Student Applicaton</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
     crossorigin="anonymous">
     <style>
        #form-body{
            height: 400px;
            margin-top: 100px;
            width:900px;
        }
     </style>
</head>
<body>
    <div id="main">
        
        <div id="canvas">
            <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Update Student Application</h5>
            </div>
            <div>
                <h6>{{ drive.job_title }}</h6>
            </div>
            
            <div id="form-body">
            <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Recieved Applications</h5>

            </div>

            <div class="card-body">
                <table class="table table-bordered align-middle">
                <tbody>
                    {% for app in applications %}
                    <tr>
                        <td>{{ app.student.user.username }}</td>

                        <td class="text-end">
                            <a href="{{ url_for('student_application', application_id=app.id) }}"
                            class="btn btn-sm btn-outline-primary">
                            review Applications
                            </a>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="2" class="text-center text-muted">
                            No Student available
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
                </table>
            </div>
            </div>
               
            </div>
            <div class="card-footer text-end mx-2">
                <button type="submit" class="btn btn-sm btn-outline-success">Save</button>
            </div>

        </div>
    </div>
</body>
</html>
